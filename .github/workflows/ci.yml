name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q tools ubuntu
      - name: Run hardware-independent tests
        run: python -m unittest discover -s tools -p 'test*.py' -v
      - name: Check shell syntax
        run: |
          git ls-files -z camera initramfs persistent tools ubuntu |
            while IFS= read -r -d '' file; do
              case "$file" in
                *.py|*.c|*.cpp) continue ;;
              esac
              case "$file" in
                *.sh) ;;
                *) test -x "$file" || continue ;;
              esac
              if head -n 1 "$file" | grep -q '^#!/bin/bash'; then
                bash -n "$file"
              else
                sh -n "$file"
              fi
            done
