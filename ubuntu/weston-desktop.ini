[core]
backend=drm-backend.so
renderer=pixman
idle-time=0
require-input=false
shell=desktop-shell.so
modules=t630-rotation.so

[shell]
background-color=0xff2c1640
panel-color=0xee24112f
locking=false
panel-position=none
clock-format=minutes

[output]
name=DSI-1
mode=preferred
transform=rotate-90
scale=1

[output]
name=Virtual-1
mode=off

[launcher]
icon=/usr/local/share/t630/icons/controls.png
path=/usr/local/bin/t630-app controls

[launcher]
icon=/usr/local/share/t630/icons/files.png
path=/usr/local/bin/t630-app files

[launcher]
icon=/usr/local/share/t630/icons/editor.png
path=/usr/local/bin/t630-app editor

[launcher]
icon=/usr/share/weston/terminal.png
path=/usr/local/bin/t630-app terminal

[libinput]
left-handed=true

[terminal]
font-size=20
shell=/bin/bash

[autolaunch]
path=/usr/local/sbin/t630-desktop-autostart
watch=false
