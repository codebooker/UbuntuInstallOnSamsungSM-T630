[core]
backend=drm-backend.so
renderer=pixman
idle-time=0
require-input=false
shell=desktop-shell.so

[shell]
background-color=0xff2c1640
panel-color=0xee24112f
locking=false
panel-position=top
clock-format=minutes

[output]
name=DSI-1
mode=preferred
transform=rotate-90
scale=1

[output]
name=Virtual-1
mode=off

[launcher]
icon=/usr/share/weston/terminal.png
path=/usr/bin/weston-terminal

[libinput]
left-handed=true

[terminal]
font-size=20
shell=/bin/bash
